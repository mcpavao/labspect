name: build

# Chaque push sur main reconstruit l'image et la publie sur GHCR.
# Les pull requests construisent l'image sans la publier : on vérifie
# que le Dockerfile est valide avant de fusionner.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier que le HTML est bien formé
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tidy
          # -e : n'affiche que les erreurs. Le code de sortie 1 = avertissements
          # seulement, ce qui n'est pas bloquant ici.
          tidy -q -e site/index.html || [ $? -eq 1 ]

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: S'authentifier sur GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        if: github.event_name == 'push'
        run: |
          echo "### Image publiée" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
