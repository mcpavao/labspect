apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: labspect
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux
        email: flux@labspect.com
      messageTemplate: "image: {{range .Changed.Changes}}{{println .NewValue}}{{end}}"
    push:
      branch: main
  update:
    path: ./clusters/homelab/web
    strategy: Setters