---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: labspect
  namespace: flux-system
spec:
  image: ghcr.io/mcpavao/labspect
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: labspect
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: labspect
  filterTags:
    pattern: '^(?P<ts>[0-9]{14})-.*$'
    extract: '$ts'
  policy:
    alphabetical:
      order: asc