apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus
      version: "27.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    server:
      retention: "7d"
      persistentVolume:
        enabled: true
        storageClass: local-hdd
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 1Gi
      global:
        scrape_interval: 60s
    alertmanager:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kube-state-metrics:
      enabled: true
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 128Mi
    prometheus-node-exporter:
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 64Mi
