apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: labspect
  namespace: web
spec:
  rules:
    - host: labspect.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
    - host: www.labspect.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80