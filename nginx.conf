server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression : le HTML fait ~50 Ko, il descend autour de 12 Ko.
    gzip on;
    gzip_types text/plain text/css text/html application/javascript image/svg+xml;
    gzip_min_length 1024;

    # En-têtes de sécurité. Cloudflare gère déjà le TLS en amont.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les images et les polices peuvent être mises en cache longtemps.
    location ~* \.(jpg|jpeg|png|webp|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Le HTML est revalidé à chaque visite : un déploiement est visible tout de suite.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Page d'erreur simple plutôt que celle de nginx.
    error_page 404 /index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
